services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardroom
      POSTGRES_USER: boardroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardroom"]
      interval: 10s
      retries: 5

  minio:
    image: ghcr.io/coollabsio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9000"
      - "9002:9002"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=boardroom;Username=boardroom;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?set a 32+ char secret in .env}
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8088}
      App__FileStorageRoot: /var/boardroom/files
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      Minio__BucketName: "boardroom"
      Minio__UseSSL: "false"
      # System Default Email Configuration (used when a company HasCustomMail is false)
      Mail__Provider: "${MAIL_PROVIDER:-SMTP}"
      Mail__Host: "${SMTP_HOST:-}"
      Mail__Port: "${SMTP_PORT:-587}"
      Mail__Username: "${SMTP_USERNAME:-}"
      Mail__Password: "${SMTP_PASSWORD:-}"
      Mail__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Mail__FromName: "${SMTP_FROM_NAME:-BoardRoom}"
    volumes:
      - filestore:/var/boardroom/files   # dedicated storage outside the web root

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8088:80"

  # Nightly pg_dump + file store snapshot, 14-day retention
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - backups:/backups
      - filestore:/var/boardroom/files:ro
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%Y%m%d-%H%M);
        pg_dump -h db -U boardroom boardroom | gzip > /backups/db-$$ts.sql.gz;
        tar czf /backups/files-$$ts.tar.gz -C /var/boardroom files;
        find /backups -type f -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
  filestore:
  backups:
  miniodata:
